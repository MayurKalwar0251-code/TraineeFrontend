<!-- Move all attributes and bindings inside the opening tag -->
<app-data-table [columns]="columns" [data]="learningTasks()" [loading]="loading()" [actions]="actions">
</app-data-table>

<!-- floating button for create trainee -->
<div class="create-trainee-div">
    <button class="create-btn" (click)="createLearningTask()"  >
        +
    </button>
</div>

<app-modal [visible]="showForm()" [title]="selectedLearningTask() ? 'Edit LearningTask' : 'Create LearningTask'" (close)="closeForm()">
    <app-learning-task-form [isSaving]="isSaving()" [learningTask]="selectedLearningTask() ?? undefined" (save)="saveLearningTask($event)" (cancel)="closeForm()">
    </app-learning-task-form>
</app-modal>

<app-modal [visible]="showAssignmentDialog()" title="Assign Learning Task" (close)="closeAssignmentDialog()">
    <app-assignment-dialog [learningTask]="selectedLearningTask() ?? undefined" (save)="saveAssignment($event)" (cancel)="closeAssignmentDialog()">
        
    </app-assignment-dialog>
</app-modal>
