<div class="toolbar">
    <!-- Ensure 'Search' matches the exact case of the variable in your component.ts -->
    <input type="text" placeholder="Search ..." [(ngModel)]="search" (input)="onSearch()">

    <button type="button" (click)="createTrainee()">
        Add Trainee
    </button>
</div>

<!-- Move all attributes and bindings inside the opening tag -->
<app-data-table [columns]="columns" [data]="trainees()" [loading]="loading()" (edit)="onEdit($event)"
    (delete)="onDelete($event)">
</app-data-table>

<app-pagination [pageNumber]="pageNumber" [totalPages]="totalPages" [totalCount]="totalCount"
    (pageChanged)="changePage($event)">
</app-pagination>

<app-modal [visible]="showForm()" [title]="selectedTrainee() ? 'Edit Trainee' : 'Create Trainee'" (close)="closeForm()">
    <app-trainee-form [isSaving]="isSaving()" [trainee]="selectedTrainee() ?? undefined" (save)="saveTrainee($event)" (cancel)="closeForm()">
    </app-trainee-form>
</app-modal>
