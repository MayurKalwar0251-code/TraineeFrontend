<div class="toolbar"> 
    <!-- Ensure 'Search' matches the exact case of the variable in your component.ts -->
    <input type="text" placeholder="Search ..." [(ngModel)]="search" (keyup)="loadTrainees()">

    <button type="button">
        Add Trainee
    </button>
</div>

<!-- Move all attributes and bindings inside the opening tag -->
<app-data-table
    [columns]="columns"
    [data]="trainees()"
    [loading]="loading()"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)">
</app-data-table>
